x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: rapidgo-grupo10-secret
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/utils:/opt/airflow/utils
    - airflow-logs:/opt/airflow/logs

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: rapidgo-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: rapidgo-kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "sleep 15 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
      --create --if-not-exists --topic rapidgo.sla.entregas
      --partitions 3 --replication-factor 1"
    restart: "no"

  spark:
    image: apache/spark:3.5.9-scala2.12-java17-python3-ubuntu
    container_name: rapidgo-spark
    depends_on:
      - kafka
    ports:
      - "4040:4040"
    volumes:
      - ./spark:/opt/spark/apps
      - ./datalake:/opt/spark/datalake
    environment:
      - SPARK_MODE=master
      - PYTHONPATH=/tmp/pip-install
    command: >
      bash -c "
      pip install --target=/tmp/pip-install pandas pyarrow &&
      /opt/spark/bin/spark-submit
      --master local[*]
      --conf spark.jars.ivy=/tmp/.ivy
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9
      /opt/spark/apps/streaming_job.py
      "

  # ---------- Semana 3: Airflow (issue #45) ----------
  airflow-db:
    image: postgres:16
    container_name: rapidgo-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: rapidgo-airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
    entrypoint: /bin/bash
    command: >
      -c "airflow db migrate &&
      airflow users create --username admin --password admin
      --firstname Admin --lastname RapidGo --role Admin
      --email admin@rapidgo.local || true"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: rapidgo-airflow-webserver
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      retries: 10
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: rapidgo-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow-db-data:
  airflow-logs: