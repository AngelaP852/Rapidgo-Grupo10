# Semana 2: Kafka + creación del topic + Spark Structured Streaming.
#   docker compose up -d                      -> todo
#   docker compose up -d kafka kafka-init     -> solo Kafka (para probar el producer)
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: rapidgo-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: rapidgo-kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "sleep 15 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
      --create --if-not-exists --topic rapidgo.sla.entregas
      --partitions 3 --replication-factor 1"
    restart: "no"

  spark:
    image: apache/spark:3.5.9-scala2.12-java17-python3-ubuntu
    container_name: rapidgo-spark
    depends_on:
      kafka-init:
        condition: service_completed_successfully   # espera a que el topic exista
    ports:
      - "4040:4040"
    volumes:
      - ./spark:/opt/spark/apps
      - ./datalake:/opt/spark/datalake
    environment:
      - PYTHONPATH=/tmp/pip-install
    # pandas y pyarrow son necesarios para applyInPandasWithState; versiones fijas
    # (las mismas de requirements.txt) porque pandas 3 no es compatible con Spark 3.5.
    command: >
      bash -c "
      pip install --no-cache-dir --target=/tmp/pip-install pandas==2.2.3 pyarrow==16.1.0 'numpy<2' &&
      /opt/spark/bin/spark-submit
      --master local[*]
      --conf spark.jars.ivy=/tmp/.ivy
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9
      /opt/spark/apps/streaming_job.py
      --source kafka --bootstrap kafka:29092 --topic rapidgo.sla.entregas
      "
