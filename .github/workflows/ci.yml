name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      estricto:
        description: "Validación previa al tag v1.0.0 (exige el enlace al video en el README)"
        type: boolean
        default: false

jobs:
  # 1) Calidad del código y de las reglas: linter, sintaxis, pruebas y compose.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar Java 17 (lo necesita PySpark)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff pytest-cov

      - name: Linter (todo el código)
        run: ruff check --select E,F --ignore E501 .

      - name: Revisar sintaxis
        run: python -m compileall -q spark airflow rapidgo tests producer scripts

      - name: Pruebas (contrato, reglas de negocio, alertas, producer, DAG por AST)
        run: python -m pytest -v --cov=producer --cov=rapidgo --cov=airflow/utils --cov-fail-under=60

      - name: Validar docker-compose
        run: docker compose config --quiet

  # 2) El DAG se importa con Airflow real. Va aparte porque Airflow instalado
  #    choca con el paquete local airflow/utils que usan las pruebas unitarias.
  dag-import:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Airflow 2.10.5 (misma versión que el compose)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "apache-airflow==2.10.5" pandas pyarrow \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt"

      - name: Importar y validar el DAG
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: python scripts/validar_dag.py

  # 3) Quality gate: solo pasa si los dos jobs anteriores pasaron.
  #    Valida lo que pide el release y deja el paquete como artefacto.
  quality-gate:
    needs: [test, dag-import]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validación previa al tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ inputs.estricto }}" = "true" ]; then
            python scripts/verificar_release.py --estricto
          else
            python scripts/verificar_release.py
          fi

      - name: Empaquetar el proyecto
        run: git archive --format=tar.gz --prefix=rapidgo-grupo10/ -o rapidgo-grupo10.tar.gz HEAD

      - name: Guardar el paquete como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: rapidgo-grupo10-${{ github.sha }}
          path: rapidgo-grupo10.tar.gz
          retention-days: 30
