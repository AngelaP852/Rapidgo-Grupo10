name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Si se sube otro commit a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar Java 17 (lo necesita PySpark)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Linter
        run: ruff check --select E,F --ignore E501 tests producer spark

      - name: Revisar sintaxis
        run: python -m compileall -q spark tests producer

      - name: Pruebas
        run: python -m pytest -v

      - name: Validar docker-compose
        run: docker compose config --quiet

  integracion-spark:
    # Corre el job de Spark de verdad (sin Kafka, leyendo archivos) y compara el Data Lake
    # con un cálculo independiente en pandas. Tarda 1-2 minutos.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar Java 17 (lo necesita PySpark)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prueba de integración del job de Spark
        run: python tests/integracion_spark.py
